# Builds vocabulary documentation using Widoco and deploys to GitHub Pages.
# Each vocabulary is a git submodule containing .ttl source files.
# Widoco generates HTML docs and serializations (.jsonld, .rdf, .nt).

name: Build and deploy vocabulary docs

# Triggers on push to main or manual dispatch from the Actions tab
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out this repo and all vocabulary submodules
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Run Widoco to generate documentation for TROV 0.1
      - name: Build TROV 0.1 docs
        uses: addnab/docker-run-action@v3
        with:
          image: craigwillis/widoco:latest
          options: -v ${{ github.workspace }}/trov/0.1/trov.config:/usr/local/widoco/config/config.properties -v ${{ github.workspace }}/trov/0.1/:/usr/local/widoco/in -v ${{ github.workspace }}:/usr/local/widoco/out
          run: |
              # Generate docs from the .ttl source
              java -jar widoco.jar -ontFile in/trov.ttl -outFolder out/build -rewriteAll
              # Organize output under trov/0.1/ to match the GitHub Pages URL structure
              # Widoco puts output in doc/ when ontology IRI ends with /,
              # directly in the output folder otherwise
              mkdir -p out/site/trov/0.1
              if [ -d out/build/doc ]; then
                mv out/build/doc/* out/site/trov/0.1/
              else
                mv out/build/* out/site/trov/0.1/
              fi
              # Rename Widoco's default output files to vocabulary-specific names
              # so the w3id.org content negotiation rules can find them
              mv out/site/trov/0.1/index-en.html out/site/trov/0.1/index.html
              mv out/site/trov/0.1/ontology.ttl out/site/trov/0.1/trov.ttl
              mv out/site/trov/0.1/ontology.jsonld out/site/trov/0.1/trov.jsonld
              mv out/site/trov/0.1/ontology.rdf out/site/trov/0.1/trov.rdf
              mv out/site/trov/0.1/ontology.nt out/site/trov/0.1/trov.nt
              rm -r out/build

      # Run Widoco to generate documentation for TROV pre-release
      - name: Build TROV pre-release docs
        uses: addnab/docker-run-action@v3
        with:
          image: craigwillis/widoco:latest
          options: -v ${{ github.workspace }}/trov/prerelease/trov.config:/usr/local/widoco/config/config.properties -v ${{ github.workspace }}/trov/prerelease/:/usr/local/widoco/in -v ${{ github.workspace }}:/usr/local/widoco/out
          run: |
              java -jar widoco.jar -ontFile in/trov.ttl -outFolder out/build -rewriteAll
              mkdir -p out/site/trov/prerelease
              # Widoco puts output in doc/ when ontology IRI ends with /,
              # directly in the output folder otherwise
              if [ -d out/build/doc ]; then
                mv out/build/doc/* out/site/trov/prerelease/
              else
                mv out/build/* out/site/trov/prerelease/
              fi
              mv out/site/trov/prerelease/index-en.html out/site/trov/prerelease/index.html
              mv out/site/trov/prerelease/ontology.ttl out/site/trov/prerelease/trov.ttl
              mv out/site/trov/prerelease/ontology.jsonld out/site/trov/prerelease/trov.jsonld
              mv out/site/trov/prerelease/ontology.rdf out/site/trov/prerelease/trov.rdf
              mv out/site/trov/prerelease/ontology.nt out/site/trov/prerelease/trov.nt
              rm -r out/build

      # Copy the vocabulary index page into the site output
      - name: Add index page
        run: cp index.html site/index.html

      # Verify expected files exist before deploying
      - name: Verify build output
        run: |
          echo "Checking index page..."
          test -f site/index.html
          echo "Checking TROV 0.1..."
          test -f site/trov/0.1/index.html
          test -f site/trov/0.1/trov.ttl
          test -f site/trov/0.1/trov.jsonld
          test -f site/trov/0.1/trov.rdf
          test -f site/trov/0.1/trov.nt
          echo "Checking TROV pre-release..."
          test -f site/trov/prerelease/index.html
          test -f site/trov/prerelease/trov.ttl
          test -f site/trov/prerelease/trov.jsonld
          test -f site/trov/prerelease/trov.rdf
          test -f site/trov/prerelease/trov.nt
          echo "All expected files present."

      # Deploy the built site to the gh-pages branch
      # Only runs on push to main, not on manual dispatches from PRs
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
